{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulse.fullname" . }}-redis
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  clusterIP: None
  selector:
    {{- include "pulse.redisSelectorLabels" . | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pulse.fullname" . }}-redis
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "pulse.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "pulse.redisSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pulse.redisSelectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "pulse.podSecurityContext" . | nindent 8 }}
        runAsUser: 999           # the 'redis' user in the official image
        runAsGroup: 999
        fsGroup: 999             # make the data volume writable for that user
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--appendonly", "yes", "--save", ""]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            {{- include "pulse.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  {{- if .Values.redis.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.redis.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size }}
  {{- else }}
      volumes:
        - name: data
          emptyDir: {}
  {{- end }}
{{- end }}
