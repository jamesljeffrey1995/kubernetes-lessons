# Steady, healthy traffic: about 10 requests per second to the shop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic
  template:
    metadata:
      labels:
        app: traffic
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: curl
          image: curlimages/curl:8.17.0
          command: ["sh", "-c", "while true; do curl -s -o /dev/null -m 2 http://shop/; sleep 0.1; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
