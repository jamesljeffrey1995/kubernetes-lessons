# Ticket #2: "Orders keeps restarting. RESTARTS is in the dozens."
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: broken
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders }
  template:
    metadata:
      labels: { app: orders }
    spec:
      containers:
        - name: app
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
            - |
              echo "orders service v2.3 starting"
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: DATABASE_URL is not set" >&2
                exit 1
              fi
              echo "connected to $DATABASE_URL"
              sleep infinity
          env:
            - name: DATABASE_HOST
              value: "postgres.broken.svc:5432"
