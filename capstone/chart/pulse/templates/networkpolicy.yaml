{{- if .Values.networkPolicy.enabled }}
# The web Pods accept traffic only from the gateway's namespace and from Pods in this
# release's own namespace (load generator, helm tests). Nothing else in the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pulse.fullname" . }}-web
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pulse.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
        - podSelector: {}
      ports:
        - port: http
{{- if .Values.redis.enabled }}
---
# Redis accepts connections ONLY from the Pulse web Pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pulse.fullname" . }}-redis
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pulse.redisSelectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "pulse.selectorLabels" . | nindent 14 }}
      ports:
        - port: redis
{{- end }}
{{- end }}
