# Three Pods with health checks and resource settings - the shape of every production Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
spec:
  replicas: 3
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          ports:
            - name: http
              containerPort: 80
          # READINESS: "should this Pod receive traffic right now?"
          # Failing => removed from the Service's endpoints. NOT restarted.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 1
          # LIVENESS: "is this process hopelessly stuck?"
          # Failing => the kubelet KILLS and restarts the container.
          # Keep it simpler than readiness: here we only check the port accepts connections.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # STARTUP (optional): holds off the other probes until the app has started.
          # Use it for slow starters instead of a huge initialDelaySeconds on liveness.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30     # allow up to 30 x 2s = 60s to start
          resources:
            requests:                # what the SCHEDULER reserves on a node for this container
              cpu: 50m               # 50 millicores = 5% of one CPU core
              memory: 32Mi
            limits:
              memory: 64Mi           # hard cap: exceed it and the container is OOM-killed
              # no CPU limit on purpose - see the README
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
spec:
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
