# Two containers in one Pod. They share:
#   - the network: same IP, can reach each other on localhost
#   - any volumes they both mount (here, an emptyDir scratch volume)
# The "content" container writes a page every 5 seconds; nginx serves it.
apiVersion: v1
kind: Pod
metadata:
  name: web-with-sidecar
  labels:
    app: web-with-sidecar
spec:
  volumes:
    - name: html
      emptyDir: {}          # empty directory, created with the Pod, deleted with the Pod
  containers:
    - name: nginx
      image: nginx:1.29-alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
    - name: content
      image: busybox:1.37
      command: ["sh", "-c"]
      args:
        - |
          while true; do
            echo "<h1>Hello from $(hostname)</h1><p>Updated at $(date)</p>" > /html/index.html
            sleep 5
          done
      volumeMounts:
        - name: html
          mountPath: /html
