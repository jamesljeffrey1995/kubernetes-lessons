name: CI

# Proves the course actually works: lints everything, then creates a real kind cluster with the
# course's own scripts and runs every lesson and the capstone demo against it - once with the
# bash scripts + Helm 3, once with the PowerShell scripts + Helm 4. A third job repeats the
# essentials on ROOTLESS PODMAN with no 'docker' command at all, like a Red Hat workstation, and
# a fourth on ROOT'S Podman through sudo (ENGINE_SUDO=1, lessons/00-setup/rootful.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KIND_VERSION: v0.33.0
  KUBECTL_VERSION: v1.37.2

jobs:
  static:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: capstone/app/go.mod

      - name: Go format, vet, test
        working-directory: capstone/app
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "Run gofmt"; exit 1; }
          go vet ./...
          go test ./...

      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1

      - name: Helm lint
        run: |
          helm lint lessons/11-helm/hello
          helm lint capstone/chart/pulse
          helm lint capstone/chart/pulse -f capstone/values-v2.yaml -f capstone/values-autoscale.yaml

      - name: Kustomize overlays render
        run: |
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" && chmod +x kubectl
          for overlay in lessons/15-kustomize/base lessons/15-kustomize/overlays/*/; do
            ./kubectl kustomize "$overlay" > /dev/null && echo "ok $overlay"
          done
          rm kubectl

      - name: ShellCheck
        run: shellcheck scripts/*.sh capstone/scripts/*.sh tests/*.sh

      - name: Pre-flight checks against simulated machines (bash + PowerShell)
        run: ./tests/check-prereqs-test.sh

      - name: ENGINE_SUDO wrapper and kubeconfig merge (fake sudo, real kubectl)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x "$RUNNER_TEMP/bin/kubectl"
          PATH="$RUNNER_TEMP/bin:$PATH" ./tests/engine-sudo-test.sh

      - name: PowerShell 7 parse check
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { Write-Host "$($_.FullName)"; $errors | Format-List; $failed = $true }
          }
          if ($failed) { exit 1 }

  windows-powershell:
    name: Windows PowerShell 5.1 parse check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every .ps1 with Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { Write-Host "$($_.FullName)"; $errors | Format-List; $failed = $true }
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            if ($bytes | Where-Object { $_ -gt 127 }) { Write-Host "Non-ASCII characters in $($_.FullName) (breaks PS 5.1)"; $failed = $true }
          }
          if ($failed) { exit 1 }

  e2e:
    name: End-to-end (${{ matrix.shell }} scripts, Helm ${{ matrix.helm }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: bash
            helm: v3.22.1
          - shell: pwsh
            helm: v4.2.4
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ matrix.helm }}

      - name: Install kind and kubectl
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install -m 0755 kind kubectl /usr/local/bin/
          kind version; kubectl version --client; helm version

      - name: Check prerequisites
        run: |
          if [ "${{ matrix.shell }}" = "bash" ]; then ./scripts/check-prereqs.sh
          else pwsh -NoProfile -File scripts/check-prereqs.ps1; fi

      - name: Create cluster (scripts/cluster-up)
        run: |
          if [ "${{ matrix.shell }}" = "bash" ]; then ./scripts/cluster-up.sh
          else pwsh -NoProfile -File scripts/cluster-up.ps1; fi
          kubectl -n kube-system rollout status deploy/metrics-server --timeout=180s
          for i in $(seq 1 30); do kubectl top nodes && break; sleep 5; done

      - name: Lessons 03-20
        if: matrix.shell == 'bash'
        run: ./tests/lessons-test.sh

      - name: Capstone - build and deploy
        run: |
          if [ "${{ matrix.shell }}" = "bash" ]; then
            ./capstone/scripts/build.sh && ./capstone/scripts/deploy.sh
          else
            pwsh -NoProfile -File capstone/scripts/build.ps1
            pwsh -NoProfile -File capstone/scripts/deploy.ps1
          fi

      - name: Capstone - zero-downtime proof
        if: matrix.shell == 'bash'
        run: ./tests/zero-downtime.sh

      - name: Capstone - full demo (auto mode, NetworkPolicy enforcement required)
        env:
          STRICT_NETPOL: "1"
        run: |
          if [ "${{ matrix.shell }}" = "bash" ]; then ./capstone/scripts/demo.sh --auto
          else pwsh -NoProfile -File capstone/scripts/demo.ps1 -Auto; fi

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -80 || true
          kubectl describe pods -n pulse || true
          kubectl logs -n traefik deploy/traefik --tail=50 || true
          kubectl -n kube-system logs ds/kindnet --tail=50 || true

  rootless-podman:
    name: End-to-end (rootless Podman, no docker command)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1

      - name: Install kind and kubectl
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install -m 0755 kind kubectl /usr/local/bin/

      - name: Make the runner look like a Red Hat workstation (Podman only, rootless)
        run: |
          # No Docker: the scripts must cope with 'podman' alone.
          sudo systemctl stop docker.socket docker.service || true
          sudo rm -f /usr/bin/docker /usr/local/bin/docker
          if command -v docker; then echo "docker is still on PATH"; exit 1; fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq podman uidmap slirp4netns passt aardvark-dns netavark fuse-overlayfs

          # A systemd user session that outlives each step (what a real login gives you).
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 1 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"

          # The host settings from lessons/00-setup/rootless.md that this image lacks.
          sudo modprobe -a ip_tables ip6_tables iptable_nat ip6table_nat fuse
          sudo sysctl -w fs.inotify.max_user_instances=512 fs.inotify.max_user_watches=524288
          mkdir -p ~/.config/containers
          printf '[containers]\nlog_driver = "k8s-file"\npids_limit = 65536\n' > ~/.config/containers/containers.conf

      - name: Show the engine
        run: |
          podman version
          podman info
          systemctl --version | head -n 1
          cat "/sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service/cgroup.controllers"

      - name: Check prerequisites
        run: ./scripts/check-prereqs.sh

      - name: Create cluster (scripts/cluster-up.sh)
        run: ./scripts/cluster-up.sh

      - name: Lessons that depend most on the host (networking, storage, limits, gateway, security)
        env:
          ONLY: "05 08 09 10 12 16 17 19 20"
        run: ./tests/lessons-test.sh

      - name: Capstone - build with Podman, load into kind, deploy
        run: ./capstone/scripts/build.sh && ./capstone/scripts/deploy.sh

      - name: Capstone - zero-downtime proof
        run: ./tests/zero-downtime.sh

      - name: Simulate a reboot - stopped nodes must come back with cluster-up
        run: |
          podman stop lessons-worker lessons-worker2 lessons-control-plane
          ./scripts/cluster-up.sh
          kubectl get nodes
          kubectl -n pulse rollout status deploy/pulse --timeout=180s

      - name: Diagnostics on failure
        if: failure()
        run: |
          podman ps -a || true
          podman logs --tail 60 lessons-control-plane || true
          kubectl get nodes -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -80 || true
          kubectl -n kube-system logs ds/kube-proxy --tail=30 || true
          kubectl -n kube-system logs ds/kindnet --tail=50 || true
          journalctl --user --no-pager -n 80 || true

  rootful-podman-sudo:
    name: End-to-end (root's Podman through sudo, ENGINE_SUDO=1)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ENGINE_SUDO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1

      - name: Install kind and kubectl
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install -m 0755 kind kubectl /usr/local/bin/

      - name: Make the runner look like a Red Hat workstation (Podman only, RHEL's sudo)
        run: |
          sudo systemctl stop docker.socket docker.service || true
          sudo rm -f /usr/bin/docker /usr/local/bin/docker
          if command -v docker; then echo "docker is still on PATH"; exit 1; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman aardvark-dns netavark

          # RHEL's sudo: /usr/local/bin is NOT on secure_path, so a plain 'sudo kind' fails there.
          echo 'Defaults secure_path="/usr/sbin:/usr/bin:/sbin:/bin"' | sudo tee /etc/sudoers.d/zz-rhel-path
          sudo chmod 0440 /etc/sudoers.d/zz-rhel-path
          if sudo sh -c 'command -v kind'; then echo "kind is still on sudo's PATH"; exit 1; fi

          # The two host settings rootful.md asks for.
          sudo sysctl -w fs.inotify.max_user_instances=512 fs.inotify.max_user_watches=524288
          sudo mkdir -p /etc/containers/containers.conf.d
          printf '[containers]\npids_limit = 65536\n' | sudo tee /etc/containers/containers.conf.d/90-kind.conf

      - name: Check prerequisites
        run: ./scripts/check-prereqs.sh

      - name: Create cluster (scripts/cluster-up.sh)
        run: ./scripts/cluster-up.sh

      - name: kubectl runs as the user, and the nodes belong to root
        run: |
          test "$(kubectl config current-context)" = kind-lessons
          test -O "$HOME/.kube/config"
          kubectl get nodes
          sudo podman ps --format '{{.Names}}' | grep -qx lessons-control-plane
          if podman ps --format '{{.Names}}' 2>/dev/null | grep -q lessons; then echo "nodes are in the user's Podman"; exit 1; fi

      - name: Lessons that depend most on the host (networking, storage, limits, gateway, security)
        env:
          ONLY: "05 08 09 10 12 16 17 19 20"
        run: ./tests/lessons-test.sh

      - name: Capstone - build with root's Podman, load into kind, deploy
        run: ./capstone/scripts/build.sh && ./capstone/scripts/deploy.sh

      - name: Capstone - zero-downtime proof
        run: ./tests/zero-downtime.sh

      - name: Simulate a reboot - stopped nodes must come back with cluster-up
        run: |
          sudo podman stop lessons-worker lessons-worker2 lessons-control-plane
          ./scripts/cluster-up.sh
          kubectl get nodes
          kubectl -n pulse rollout status deploy/pulse --timeout=180s

      - name: cluster-down removes the cluster and the user's kubeconfig entry
        run: |
          ./scripts/cluster-down.sh
          if sudo podman ps -a --format '{{.Names}}' | grep -q lessons; then echo "nodes still exist"; exit 1; fi
          if kubectl config get-contexts -o name | grep -qx kind-lessons; then echo "context still there"; exit 1; fi

      - name: Diagnostics on failure
        if: failure()
        run: |
          sudo podman ps -a || true
          sudo podman logs --tail 60 lessons-control-plane || true
          kubectl get nodes -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -80 || true
          kubectl -n kube-system logs ds/kube-proxy --tail=30 || true
          kubectl -n kube-system logs ds/kindnet --tail=50 || true
