# Same app, but liveness checks /health - so making /health fail gets the container RESTARTED.
apiVersion: v1
kind: Pod
metadata:
  name: liveness-demo
  labels:
    app: liveness-demo
spec:
  containers:
    - name: whoami
      image: traefik/whoami:v1.11.0
      ports:
        - name: http
          containerPort: 80
      livenessProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 3
        failureThreshold: 2
