# A workload for the "dedicated" node. It needs BOTH halves:
#   - a toleration: "I am allowed on nodes with the taint dedicated=batch"  (permission)
#   - a nodeSelector: "and I only want nodes labelled dedicated=batch"      (attraction)
# A toleration alone would let it run there, but also anywhere else.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: batch
  template:
    metadata:
      labels:
        app: batch
    spec:
      terminationGracePeriodSeconds: 1
      tolerations:
        - key: dedicated
          operator: Equal
          value: batch
          effect: NoSchedule
      nodeSelector:
        dedicated: batch
      containers:
        - name: worker
          image: busybox:1.37
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 16Mi
