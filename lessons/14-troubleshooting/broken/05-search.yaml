# Ticket #5: "http://search.broken gives 'connection refused', but the Pods look fine
#             and the Service has endpoints."
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: broken
spec:
  replicas: 2
  selector:
    matchLabels: { app: search }
  template:
    metadata:
      labels: { app: search }
    spec:
      containers:
        - name: web
          image: nginx:1.29-alpine
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: search
  namespace: broken
spec:
  selector:
    app: search
  ports:
    - port: 80
      targetPort: 8080
