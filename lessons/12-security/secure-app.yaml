# The same kind of web app, locked down. This passes the "restricted" standard.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: secure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false   # this app never calls the Kubernetes API
      securityContext:                      # applies to every container in the Pod
        runAsNonRoot: true                  # refuse to start if the image would run as root
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault              # block dangerous system calls
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          ports:
            - name: http
              containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false # no setuid/sudo tricks
            readOnlyRootFilesystem: true    # attacker can't drop tools onto the filesystem
            capabilities:
              drop: ["ALL"]                 # no special Linux privileges at all
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: secure
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: http
