# A small app deployed INTO team-a. Note there are no resources set on the container:
# the LimitRange fills them in. The labels follow the recommended app.kubernetes.io/* scheme.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: team-a
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: frontend
    app.kubernetes.io/version: "1.29"
  annotations:
    # annotations: free-text notes for humans and tools. NOT used for selecting objects.
    owner: "team-a@example.com"
    runbook: "https://wiki.example.com/shop/web"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: shop
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
