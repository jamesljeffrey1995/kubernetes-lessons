apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pulse.fullname" . }}
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
data:
  APP_COLOR: {{ .Values.app.color | quote }}
  APP_MESSAGE: {{ .Values.app.message | quote }}
  SHUTDOWN_DELAY: {{ .Values.app.shutdownDelay | quote }}
  REDIS_ADDR: {{ include "pulse.redisAddr" . | quote }}
